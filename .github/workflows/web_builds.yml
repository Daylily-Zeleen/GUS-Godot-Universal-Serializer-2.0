name: 🌐 Web Builds
on:
  workflow_call:

# Global Settings
env:
  SCONSFLAGS: verbose=yes warnings=extra werror=yes
  EM_VERSION: 3.1.18
  EM_CACHE_FOLDER: "emsdk-cache"

jobs:
  web:
    runs-on: ubuntu-20.04
    name: Web Build ${{ matrix.target }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        target: [template_release]
        arch: [wasm32]
        threads: [yes, no]
        include:
          - threads: yes
            shlibsuffix: wasm
          - threads: no
            shlibsuffix: nothreads.wasm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Emscripten latest
        uses: mymindstorm/setup-emsdk@v13
        with:
          version: ${{env.EM_VERSION}}
          actions-cache-folder: ${{env.EM_CACHE_FOLDER}}

      - name: Verify Emscripten setup
        run: |
          emcc -v

      - name: Build ${{ matrix.target }} ${{ matrix.arch }} threads=${{ matrix.threads }}
        uses: ./.github/actions/build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} threads=${{ matrix.threads }}
          arch: ${{ matrix.arch }}
          platform: web
          target: ${{ matrix.target }}
          build_profile: build_profile.json

      - name: Upload ${{ matrix.target }} ${{ matrix.arch }} threads=${{ matrix.threads }}
        uses: ./.github/actions/upload
        with:
          platform: web
          artifact_file_suffix: web.${{ matrix.arch }}.${{ matrix.shlibsuffix }}

