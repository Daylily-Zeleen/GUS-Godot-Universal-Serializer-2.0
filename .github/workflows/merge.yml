name: 📦 Merge Artifacts
on:
  workflow_call:

# Global Settings
env:
  ARTIFACT_PREFIX: GUS2-

permissions:
  actions: write
  contents: read

jobs:
  merge:
    runs-on: ubuntu-22.04
    name: Merge all platform artifacts into one package
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: merged
          pattern: ${{ env.ARTIFACT_PREFIX }}*

      - name: Merge into a single dist tree
        shell: bash
        run: |
          set -e
          mkdir -p dist
          # Each downloaded artifact is a folder named after the artifact (e.g. GUS2-windows-x86_64).
          # Its contents are the dist/ tree (addons/..., README.md, ...). Merge them all together.
          for d in merged/${{ env.ARTIFACT_PREFIX }}*; do
            if [ -d "$d/dist" ]; then
              cp -r "$d/dist/." dist/
            elif [ -d "$d" ]; then
              cp -r "$d/." dist/
            fi
          done
          echo "Merged contents:"
          ls -R dist | head -50

      - name: Verify merged package completeness
        shell: bash
        run: |
          set -e
          BIN="dist/addons/com.daylily_zeleen.godot_universal_serializer2/bin"
          missing=0
          check() {
            if [ ! -e "$1" ]; then
              echo "MISSING: $1"
              missing=$((missing+1))
            else
              echo "OK: $1"
            fi
          }
          check "$BIN/libgus2.macos.framework/Resources/Info.plist"
          check "$BIN/libgus2.macos.framework/libgus2.macos"
          check "$BIN/libgus2.windows.x86_32.dll"
          check "$BIN/libgus2.windows.x86_64.dll"
          check "$BIN/libgus2.linux.x86_64.so"
          check "$BIN/libgus2.android.x86_64.so"
          check "$BIN/libgus2.android.arm64.so"
          check "$BIN/libgus2.ios.dylib"
          check "$BIN/libgus2.web.wasm32.wasm"
          check "$BIN/libgus2.web.wasm32.nothreads.wasm"
          if [ "$missing" -ne 0 ]; then
            echo "ERROR: $missing required file(s) missing from merged package."
            exit 1
          fi
          echo "All required files present."

      - name: Upload merged package
        uses: actions/upload-artifact@v7
        with:
          name: Godot Universal Serializer 2
          path: |
            dist/**
          retention-days: 14

      - name: Remove intermediate per-platform artifacts
        shell: bash
        run: |
          # Only the merged package above should remain; delete the per-platform artifacts.
          for a in $(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[] | select(.name | startswith("${{ env.ARTIFACT_PREFIX }}")) | .id'); do
            gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$a || true
          done
        env:
          GH_TOKEN: ${{ github.token }}
