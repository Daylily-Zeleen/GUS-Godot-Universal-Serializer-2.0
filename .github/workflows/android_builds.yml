name: 🤖 Android Builds
on:
  workflow_call:

# Global Settings
env:
  SCONSFLAGS: verbose=yes warnings=extra werror=yes

jobs:
  android:
    runs-on: "ubuntu-22.04"
    name: Android Build ${{ matrix.target }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        target: [template_release]
        arch: [arm64, x86_64]
        shlibsuffix: [so]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11

      - name: Android dependencies
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          link-to-sdk: true

      - name: Build ${{ matrix.target }} ${{ matrix.arch }}
        uses: ./.github/actions/build
        with:
          sconsflags: ${{ env.SCONSFLAGS }}
          arch: ${{ matrix.arch }}
          platform: android
          target: ${{ matrix.target }}
          build_profile: build_profile.json

      - name: Upload ${{ matrix.target }} ${{ matrix.arch }}
        uses: ./.github/actions/upload
        with:
          platform: android
          artifact_file_suffix: android.${{ matrix.arch }}.${{ matrix.shlibsuffix }}
          artifact_name: GUS2-android-${{ matrix.arch }}
